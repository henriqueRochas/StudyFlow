<section class="materias-section">
  <h2 class="section-title">Minhas matérias</h2>

  <ul class="materias-list">
    @for (materia of materias(); track materia.id) {
    <li class="materia-item">
      <span>Matéria: {{ materia.nome }}</span> <!-- EXIBE O VALOR DO ITEM ATUAL -->
      <span>ID: {{ materia.id }}</span>
    </li>
    }
  </ul>
  <form (ngSubmit)="CadastrarMateria()">
    <p>Cadastrar:</p>
    <input type="text" name="nomeNovaMateria" [(ngModel)]="nomeNovaMateria" /> <!-- ngModel: SINCRONIZA O TYPESCRIPT COM O CAMPO -->
    <p>Você digitou: {{ nomeNovaMateria()}}</p> <!-- EXIBE O VALOR DO ITEM ATUAL -->
    <button type="submit">Cadastrar</button>
  </form>
</section>
